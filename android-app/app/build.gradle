plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.adamxit.glowupai'
    compileSdk 34

    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.adamxit.glowupai'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DLLAMA_CURL=OFF'
                arguments '-DLLAMA_BUILD_TESTS=OFF'
                arguments '-DLLAMA_BUILD_EXAMPLES=OFF'
                arguments '-DLLAMA_BUILD_SERVER=OFF'
                arguments '-DLLAMA_BUILD_COMMON=OFF'
                arguments '-DGGML_LLAMAFILE=OFF'
                arguments '-DGGML_OPENMP=OFF'
                arguments '-DBUILD_SHARED_LIBS=OFF'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += ['../../models']
        }
    }

    androidResources {
        noCompress 'gguf'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
