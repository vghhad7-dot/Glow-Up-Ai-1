cd ~/glow-up-ai
command -v python3 >/dev/null || pkg install -y python

python3 - <<'EOF'
from pathlib import Path
p = Path(".github/workflows/build-debug.yml")
s = p.read_text(encoding="utf-8")
old_setup = """      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

"""
old_install = """      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
"""
new_install = """      - name: Install SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
"""
if old_setup not in s or old_install not in s:
    raise SystemExit("pattern not found, file not changed")
s = s.replace(old_setup, "").replace(old_install, new_install)
p.write_text(s, encoding="utf-8")
print("ok")
EOF
